<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: cabecera('Panel de módulo')}"></head>
<body class="modulo-bg">
<div class="container py-4" style="max-width: 760px;">

    <div th:if="${mensaje}" class="alert alert-success" role="alert" th:text="${mensaje}"></div>
    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>

    <div class="hnal-card mb-3">
        <div class="hnal-flex-between">
            <div>
                <div class="fw-bold">Panel de Módulo</div>
                <small class="text-muted">Hospital Nacional Arzobispo Loayza - HNAL</small>
            </div>
            <div class="text-end d-flex align-items-center gap-2">
                <span class="badge bg-secondary">Módulo: <span th:text="${panel.numeroModulo()}">1</span></span>
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Cerrar sesión</button>
                </form>
            </div>
        </div>
    </div>

    <div id="zona-modulo" th:insert="~{modulo/fragmentos :: zona}"></div>

    <div class="hnal-card">
        <form th:action="@{/modulo/incidencia}" method="post" class="m-0">
            <div class="fw-bold mb-2"><i class="bi bi-exclamation-triangle text-warning"></i> Reportar incidencia</div>
            <select name="tipo" class="form-select mb-2">
                <option th:each="t : ${tiposIncidencia}" th:value="${t}" th:text="${t}">Tipo</option>
            </select>
            <textarea name="descripcion" class="form-control mb-2" rows="2" maxlength="500"
                      placeholder="Descripción breve de la incidencia..."></textarea>
            <button type="submit" class="btn w-100" style="background:#c98a75;color:#fff">Reportar incidencia</button>
        </form>
    </div>
</div>

<script th:src="@{/js/tiempo-real.js}"></script>
<script>
    TiempoReal.iniciar('zona-modulo', '/modulo/zona');
</script>
<script>
    // Cuenta regresiva del tiempo de gracia: data-restan trae los segundos que faltaban al dibujar la zona.
    setInterval(function () {
        document.querySelectorAll('[data-restan]').forEach(function (el) {
            if (!el.dataset.t0) { el.dataset.t0 = String(Date.now()); }
            var transcurrido = Math.floor((Date.now() - Number(el.dataset.t0)) / 1000);
            var restan = Math.max(0, Number(el.dataset.restan) - transcurrido);
            var minutos = Math.floor(restan / 60);
            var segundos = restan % 60;
            el.textContent = restan > 0 ? (minutos + ':' + String(segundos).padStart(2, '0')) : 'vencido';
            el.classList.toggle('text-danger', restan === 0 || 30 > restan);
        });
    }, 1000);
</script>
</body>
</html>
