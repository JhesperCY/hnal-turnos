<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="cabecera(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' · Sistema de Gestión de Turnos - HNAL'">Sistema de Gestión de Turnos - HNAL</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/hnal.css}">
</head>
<body>
<header th:fragment="navSupervisor(activa)" class="admin-navbar text-white p-3">
    <div class="container-fluid hnal-flex-between">
        <div class="d-flex align-items-center gap-2">
            <span class="fs-4"><i class="bi bi-hospital"></i></span>
            <div>
                <div class="fw-bold">Administración</div>
                <small class="text-white-50">Hospital Nacional Arzobispo Loayza - HNAL</small>
            </div>
        </div>
        <div class="d-flex align-items-center gap-3">
            <span class="badge" th:classappend="${jornadaActiva} ? 'bg-success' : 'bg-secondary'">
                <i class="bi bi-circle-fill"></i> <span th:text="${jornadaActiva} ? 'Sistema activo' : 'Jornada cerrada'">Sistema activo</span>
            </span>
            <span class="small" th:text="${usuarioActual}">usuario</span>
            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="btn btn-sm btn-outline-light">Cerrar sesión</button>
            </form>
        </div>
    </div>
    <div class="container-fluid mt-2">
        <ul class="nav">
            <li class="nav-item"><a class="nav-link" th:classappend="${activa == 'resumen'} ? 'active'" th:href="@{/supervisor}"><i class="bi bi-bar-chart"></i> Resumen</a></li>
            <li class="nav-item"><a class="nav-link" th:classappend="${activa == 'incidencias'} ? 'active'" th:href="@{/supervisor/incidencias}"><i class="bi bi-exclamation-triangle"></i> Incidencias</a></li>
            <li class="nav-item"><a class="nav-link" th:classappend="${activa == 'gestion'} ? 'active'" th:href="@{/supervisor/gestion}"><i class="bi bi-people"></i> Usuarios y módulos</a></li>
        </ul>
    </div>
</header>
<nav th:fragment="barra(titulo)" class="navbar navbar-dark bg-primary px-3 mb-3">
    <span class="navbar-brand mb-0 h1" th:text="${titulo}">Sistema de Turnos</span>
    <form th:action="@{/logout}" method="post" class="d-flex align-items-center gap-3 m-0">
        <span class="text-white" th:text="${usuarioActual}">usuario</span>
        <button type="submit" class="btn btn-outline-light btn-sm">Cerrar sesión</button>
    </form>
</nav>
</body>
</html>
