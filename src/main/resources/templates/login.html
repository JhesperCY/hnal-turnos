<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: cabecera('Iniciar sesión')}"></head>
<body class="login-bg">

<div class="hnal-center-screen">
    <div class="login-card bg-white">
        <div class="login-side d-flex align-items-end p-4">
            <div class="text-white">
                <div class="fs-3"><i class="bi bi-hospital"></i></div>
                <div class="fw-bold">Hospital Nacional<br>Arzobispo Loayza</div>
                <small class="text-white-50">Sistema de Gestión de Turnos</small>
            </div>
        </div>
        <form th:action="@{/login}" method="post" class="p-4 p-md-5 d-flex flex-column justify-content-center">
            <p class="text-uppercase text-muted small fw-bold mb-3">Acceso del personal</p>

            <div th:if="${param.error}" class="alert alert-danger py-2 small" role="alert">
                No se pudo iniciar sesión. Revise su usuario y contraseña. Tras tres intentos fallidos la cuenta se bloquea durante 5 minutos.
            </div>
            <div th:if="${param.logout}" class="alert alert-success py-2 small" role="alert">
                Sesión cerrada correctamente.
            </div>

            <input name="username" class="form-control mb-2" placeholder="Usuario" autocomplete="username" autofocus required>
            <input name="password" type="password" class="form-control mb-3" placeholder="Contraseña" autocomplete="current-password" required>
            <button type="submit" class="btn btn-success fw-bold mb-2">INGRESAR</button>
            <hr>
            <a th:href="@{/kiosko}" class="small text-muted"><i class="bi bi-arrow-left"></i> Volver al kiosko</a>
        </form>
    </div>
</div>

</body>
</html>
