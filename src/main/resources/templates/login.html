<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ingreso - Sistema de Turnos HNAL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container d-flex min-vh-100 align-items-center justify-content-center">
    <div class="card shadow-sm w-100" style="max-width: 24rem;">
        <div class="card-body p-4">
            <h1 class="h4 text-center mb-1">Sistema de Turnos</h1>
            <p class="text-center text-muted mb-4">Hospital Nacional Arzobispo Loayza</p>

            <div th:if="${param.error}" class="alert alert-danger" role="alert">
                No se pudo iniciar sesión. Revise su usuario y contraseña. Tras tres intentos
                fallidos la cuenta se bloquea durante 5 minutos.
            </div>
            <div th:if="${param.logout}" class="alert alert-success" role="alert">
                Sesión cerrada correctamente.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">Usuario</label>
                    <input type="text" class="form-control" id="username" name="username"
                           autocomplete="username" autofocus required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="password" name="password"
                           autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Ingresar</button>
            </form>
        </div>
    </div>
</main>
</body>
</html>
