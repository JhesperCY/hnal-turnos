<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: cabecera('Incidencias')}"></head>
<body class="admin-bg">
<header th:replace="~{fragments/base :: navSupervisor('incidencias')}"></header>

<div class="container py-4">
    <div th:if="${mensaje}" class="alert alert-success" role="alert" th:text="${mensaje}"></div>
    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>

    <div id="zona-incidencias" th:insert="~{supervisor/fragmentos :: lista}"></div>
</div>

<script th:src="@{/js/tiempo-real.js}"></script>
<script>
    TiempoReal.iniciar('zona-incidencias', '/supervisor/incidencias/lista');
</script>
</body>
</html>
